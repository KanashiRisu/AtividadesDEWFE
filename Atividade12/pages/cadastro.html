<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">

    <title>Cadastro</title>
</head>
<body>

    <header>
        <div id="logo">
            <a href="../index.html"><img id="logo-img" src="../images/logo.jpg" alt="logo"></a>
            <h1>Runners Area</h1>
        </div>
        
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="contato.html">Contato</a></li>
                <li><a href="cadastro.html">Cadastro</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Formulário de Cadastro</h2>
            <form>
                <div>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Maico" required>
                </div>

                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="@gmail.com" required>
                </div>

                <div>
                    <p id="mensagemSenha"></p>
                    <label for="senha">Senha:</label>
                    <div style="display: flex;">
                        <input oninput="validarSenha()" type="password" id="senha" name="senha" placeholder="Min 8 digitos" required>
                        <button type="button" id="alt" onclick="alternar()">Mostrar</button>
                    </div>
                </div>
                
                <div>
                    <label for="confirmar-senha">Confirmar Senha:</label>
                    <p id="mensagemSenha2"></p>
                    <input oninput="validarSenha()" type="password" id="confirmar-senha" name="confirmar-senha" required>
                </div>

                <div>
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(14) 1234-1234">
                </div>

                <div>
                    <label for="data-nascimento">Data de Nascimento:</label>
                    <input type="date" id="data-nascimento" name="data-nascimento">
                </div>

                <div>
                    <label>
                        <input type="checkbox" name="termos" required>
                        Concordo com os termos e condições
                    </label>
                </div>

                <button type="submit">Cadastrar</button>
                <button type="reset">Limpar</button>
            </form>
        </section>
        
    </main>

    <footer>
        <p>&copy; 2026 Runners Area. Todos os direitos reservados.</p>
    </footer>

    <script>
        const mensagemElement = document.getElementById("mensagemSenha");
        
        let mensagemSenha, corSenha;

        function validarSenha() {
            let senha = document.getElementById("senha").value;
            let confirmarSenha = document.getElementById("confirmar-senha").value;

            if (senha.length < 8) {

                mensagemSenha = "A senha deve ter pelo menos 8 caracteres";
                corSenha = 'red';                    
                
            }   else{

                mensagemSenha = "Senha válida";
                corSenha = 'green';
            }
            
            if (confirmarSenha == '') {

            }   else if(confirmarSenha != senha){

                    mensagemSenha = "As senhas devem ser iguais";
                    corSenha = 'red';
                }

            mensagemElement.innerText = mensagemSenha;
            mensagemElement.style.color = corSenha;
            
        }

        function alternar(){
            const inputSenha = document.getElementById('senha');
            const inputSenha2 = document.getElementById('confirmar-senha');
            const altElement = document.getElementById("alt");
            
            let altMensagem;

            if (inputSenha.type === "password") {
                inputSenha.type = "text";
                inputSenha2.type = "text";
                altMensagem = "Ocultar"
            }else{
                inputSenha.type = "password";
                inputSenha2.type = "password";
                altMensagem = "Mostrar"
            }
            altElement.textContent = altMensagem;
        }
    </script>
</body>
</html>
