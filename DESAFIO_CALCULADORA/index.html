<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Calculadora</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Astloch:wght@400;700&family=Edu+SA+Hand:wght@400..700&family=Permanent+Marker&family=Tiny5&display=swap" rel="stylesheet">
</head>
<body>

  <div class="calculator">

    <div class="display">
      <input type="text" id="display" disabled value="0">
    </div>

    <div class="buttons">

      <button class="btn" data-value="7">7</button>
      <button class="btn" data-value="8">8</button>
      <button class="btn" data-value="9">9</button>
      <button class="btn operator" id="div">÷</button>

      <button class="btn" data-value="4">4</button>
      <button class="btn" data-value="5">5</button>
      <button class="btn" data-value="6">6</button>
      <button class="btn operator" id="mult">×</button>

      <button class="btn" data-value="1">1</button>
      <button class="btn" data-value="2">2</button>
      <button class="btn" data-value="3">3</button>
      <button class="btn operator" id="sub">−</button>

      <button class="btn" data-value="0">0</button>
      <button class="btn" data-value=".">.</button>
      <button class="btn equals" id="calcular">=</button>
      <button class="btn operator" id="add">+</button>

      <button class="btn clear" id="limpar">C</button>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>>
