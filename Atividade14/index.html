<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <title>Bootstrap | Site</title>
</head>
<body>
    <header class="container mt-3">
        <div class="d-flex text-center justify-content-between">
            <h1 class="col-4 col-md-4 col-lg-4">Site</h1>

            <nav class="d-flex row text-center justify-content-between navbar">
                <a href="#" class="col-4 col-md-4 col-lg-4 headerNav"><h2>Home</h2></a>
                <a href="#" class="col-4 col-md-4 col-lg-4 headerNav"><h2>Contato</h2></a>
                <a href="#" class="col-4 col-md-4 col-lg-4 headerNav"><h2>Sobre</h2></a>
                <div class="d-flex flex-column p-5">

                    <button class="btn dropdown position-absolute top-0 end-0" type="button" data-bs-toggle="collapse" data-bs-target="#dropHeader" aria-expanded="false" aria-controls="dropHeader">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse bg-primary text-white p-3 position-absolute top-0 end-0 dropdown" id="dropHeader">
                        <ul class="nav flex-column text-center">
                            <button class="btn dropdown position-absolute top-0 start-0 " type="button" data-bs-toggle="collapse" data-bs-target="#dropHeader" aria-expanded="false" aria-controls="dropHeader">
                                <span class="fs-4 btn-close"></span>
                            </button>
                            <li class="nav-item mt-3"><a class="nav-link text-white" href="#">Home</a></li>
                            <li class="nav-item"><a class="nav-link text-white" href="#">Contato</a></li>
                            <li class="nav-item"><a class="nav-link text-white" href="#">Sobre</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
        </div>
            
        
    </header>

    <section class="bg-primary d-flex row text-center justify-content-between">
        <div class="content">
            <img src="images/" alt="">
        </div>

    </section>
    


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
